<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bgGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="borderGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>
    <linearGradient id="stemGradFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="loopGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bgGradFav)" stroke="url(#borderGradFav)" stroke-width="3" />
  <g id="p-glyph">
    <!-- Loop -->
    <path d="M 44 26 C 70 26 88 33 88 48 C 88 63 70 70 46 70 Z" fill="url(#loopGradFav)" />
    <!-- Loop negative space -->
    <rect x="48" y="37" width="22" height="22" rx="6" fill="#0c101d" />
    <!-- Vertical stem -->
    <path d="M 28 26 L 46 26 L 46 94 L 28 94 Z" fill="url(#stemGradFav)" />
    <!-- White highlight -->
    <path d="M 28 26 L 31 26 L 31 94 L 28 94 Z" fill="#ffffff" opacity="0.6" />
    <!-- Play arrow in center -->
    <polygon points="53,40 53,56 66,48" fill="#00f5ff" />
    <!-- Sparkle star -->
    <polygon points="88,24 89.5,28.5 94,30 89.5,31.5 88,36 86.5,31.5 82,30 86.5,28.5" fill="#38bdf8" />
  </g>
