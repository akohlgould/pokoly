<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.4" />
    </linearGradient>

    <!-- Stem Gradient (Cyan to Indigo) -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Loop Top & Arc Gradient (Indigo to Pink/Magenta) -->
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>

    <!-- Play Arrow Core Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Inner Glow -->
    <radialGradient id="ambientLight" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Tile with Sleek Rounded Chamfer -->
  <rect x="3" y="3" width="114" height="114" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />
  
  <!-- Subtle ambient background light -->
  <rect x="3" y="3" width="114" height="114" rx="26" fill="url(#ambientLight)" />

  <!-- Outer Neon Halo behind the P glyph -->
  <g filter="url(#glowFilter)" opacity="0.65">
    <path d="M 34 26 L 68 26 C 82 26 92 35 92 48 C 92 61 82 70 68 70 L 52 70 L 52 94 L 34 94 Z" fill="none" stroke="#d946ef" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- Main "P" Monogram Geometry -->
  <g id="pokoly-p-mark">
    <!-- Back loop ribbon (Vibrant gradient sweep) -->
    <path d="M 44 26 C 68 26 88 33 88 48 C 88 63 68 70 46 70 Z" 
          fill="url(#loopGrad)" />

    <!-- Isometric Highlight Accent on Upper Arch -->
    <path d="M 44 26 L 68 26 C 82 26 90 33 90 44 C 84 32 72 29 52 29 L 44 29 Z" 
          fill="#ffffff" opacity="0.45" />

    <!-- Negative Space Center Cavity -->
    <rect x="48" y="37" width="22" height="22" rx="7" fill="#0b0f19" />

    <!-- Vertical Stem Pillar (Sharp Modern Bevel) -->
    <path d="M 28 26 L 46 26 L 46 94 L 28 94 Z" 
          fill="url(#stemGrad)" />

    <!-- Stem Left Specular Rim -->
    <path d="M 28 26 L 31 26 L 31 94 L 28 94 Z" 
          fill="#ffffff" opacity="0.5" />

    <!-- Dynamic Play-Arrow Diamond Nested inside the P loop -->
    <polygon points="53,40 53,56 66,48" fill="url(#playGrad)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite" />
    </polygon>

    <!-- Bottom Stem Isometric Foot -->
    <polygon points="28,94 46,94 38,98 22,98" fill="#4338ca" opacity="0.7" />

    <!-- Sparkle / Star at top-right corner of the P loop -->
    <circle cx="88" cy="30" r="2" fill="#ffffff" />
    <polygon points="88,24 89.5,28.5 94,30 89.5,31.5 88,36 86.5,31.5 82,30 86.5,28.5" fill="#38bdf8" />
  </g>
</svg>